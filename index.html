    <!-- Open Graph (revisão 26/08 — item P0.2): imagem dedicada 1200×630

    <!-- Medição (28/09). Os dois scripts são assíncronos e não bloqueiam a
         renderização. Em ambiente local (localhost) a medição fica
         desligada para não sujar o relatório.

         O site é uma SPA (react-router). O page_view automático do gtag
         está DESLIGADO (send_page_view: false): quem dispara é
         src/components/TituloDaRota.tsx, depois de trocar o título da
         página, para o evento chegar com o título certo. Por isso, no GA4,
         "Alterações de página com base em eventos do histórico do
         navegador" (Medição aprimorada do fluxo) precisa ficar DESLIGADA,
         senão cada troca de rota conta duas vezes. -->
    <script>
      window.__medir = location.hostname === 'andreobarbosa.com' || location.hostname === 'www.andreobarbosa.com'
    </script>

    <!-- Google tag (gtag.js) — GA4 G-L354PT6WYD -->
    <script>
      (function () {
        if (!window.__medir) return
        var s = document.createElement('script')
        s.async = true
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-L354PT6WYD'
        document.head.appendChild(s)
        window.dataLayer = window.dataLayer || []
        window.gtag = function () { window.dataLayer.push(arguments) }
        window.gtag('js', new Date())
        window.gtag('config', 'G-L354PT6WYD', { send_page_view: false })
      })()
    </script>

    <!-- Microsoft Clarity — projeto ypht14ka1v (mapa de calor e gravação de
         sessão). Integrado ao GA4 pelo painel do Clarity, não por código. -->
    <script>
      (function (c, l, a, r, i, t, y) {
        if (!c.__medir) return
        c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) }
        // Carrega depois do load: o gravador de sessão não precisa
        // disputar banda com a primeira pintura.
        var injetar = function () {
          t = l.createElement(r); t.async = 1; t.src = 'https://www.clarity.ms/tag/' + i
          y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y)
        }
        if (l.readyState === 'complete') injetar()
        else c.addEventListener('load', injetar, { once: true })
      })(window, document, 'clarity', 'script', 'ypht14ka1v')
    </script>

    <!-- Fontes servidas pelo próprio domínio (public/fonts, subconjunto
         latin em woff2, gerado a partir dos pacotes @fontsource das mesmas
         famílias do Google Fonts). Motivo da troca, medido em 29/09: os dois
         <link> externos (fonts.googleapis.com e api.fontshare.com) eram CSS
         que bloqueia a renderização em domínios de terceiros, somando DNS,
         TLS e ida e volta antes de qualquer texto aparecer. Com o @font-face
         embutido aqui não existe mais essa ida e volta, e os três arquivos
         da primeira dobra entram em preload.

         Satoshi (Fontshare) saiu: a família só aparecia no stack do html e
         na classe .font-satoshi, e nenhum elemento renderizado do site usa
         esse stack (conferido elemento a elemento). Inter também saiu: era
         usada num único elemento por página, o botão da nav, que passou a
         usar Outfit como os outros botões do site.

         Para trocar peso ou família: ajuste o mesmo @fontsource em
         node_modules e regenere public/fonts + este bloco. -->
    <!-- Recurso de LCP: a imagem do hero. Ela nasce dentro de um elemento
         criado pelo React, então sem este preload o navegador só descobre
         que precisa dela depois de baixar e executar o bundle. Os dois
         endereços são exatamente os que <Picture>/poster pedem em cada
         faixa, para não baixar duas vezes. -->
    <link rel="preload" as="image" type="image/webp" href="/img/hero-poster-1664.webp" fetchpriority="high" media="(min-width: 768px)" />
    <link rel="preload" as="image" type="image/avif" href="/img/hero-poster-640.avif" fetchpriority="high" media="(max-width: 767px)" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/hanken-grotesk-latin-600-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/hanken-grotesk-latin-400-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/outfit-latin-400-normal.woff2" />
    <style>@font-face{font-family:"ABeeZee";font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/abeezee-latin-400-normal.woff2) format("woff2")}@font-face{font-family:"Hanken Grotesk";font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/hanken-grotesk-latin-400-normal.woff2) format("woff2")}@font-face{font-family:"Hanken Grotesk";font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/hanken-grotesk-latin-500-normal.woff2) format("woff2")}@font-face{font-family:"Hanken Grotesk";font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/hanken-grotesk-latin-600-normal.woff2) format("woff2")}@font-face{font-family:"Hanken Grotesk";font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/hanken-grotesk-latin-700-normal.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/jetbrains-mono-latin-600-normal.woff2) format("woff2")}@font-face{font-family:"Newsreader";font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/newsreader-latin-400-normal.woff2) format("woff2")}@font-face{font-family:"Newsreader";font-style:italic;font-weight:400;font-display:swap;src:url(/fonts/newsreader-latin-400-italic.woff2) format("woff2")}@font-face{font-family:"Outfit";font-style:normal;font-weight:200;font-display:swap;src:url(/fonts/outfit-latin-200-normal.woff2) format("woff2")}@font-face{font-family:"Outfit";font-style:normal;font-weight:300;font-display:swap;src:url(/fonts/outfit-latin-300-normal.woff2) format("woff2")}@font-face{font-family:"Outfit";font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/outfit-latin-400-normal.woff2) format("woff2")}@font-face{font-family:"Outfit";font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/outfit-latin-500-normal.woff2) format("woff2")}@font-face{font-family:"Outfit";font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/outfit-latin-600-normal.woff2) format("woff2")}@font-face{font-family:"Source Serif 4";font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/source-serif-4-latin-700-normal.woff2) format("woff2")}</style>
