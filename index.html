    <!-- Open Graph (revisão 26/08 — item P0.2): imagem dedicada 1200×630
         (public/og-image.png), URL absoluta — caminho relativo não
         renderiza card nenhum no LinkedIn/WhatsApp. Só a Home tem OG
         próprio por enquanto; sem SSR/pré-render (item P0.1, ainda em
         aberto) os cases sempre servem este mesmo index.html pros
         crawlers de link preview, então um og:title/description por
         case não teria efeito real até esse bloqueador ser resolvido. -->

    <!-- Medição (28/09). Os dois scripts são assíncronos e não bloqueiam a
         renderização. Em ambiente local (localhost) a medição fica
         desligada para não sujar o relatório.

         O site é uma SPA (react-router). O page_view automático do gtag
         está DESLIGADO (send_page_view: false): quem dispara é
         src/components/TituloDaRota.tsx, depois de trocar o título da
         página, para o evento chegar com o título certo. Por isso, no GA4,
         "Alterações de página com base em eventos do histórico do
         navegador" (Medição aprimorada do fluxo) precisa ficar DESLIGADA,
         senão cada troca de rota conta duas vezes. -->
    <script>
      window.__medir = location.hostname === 'andreobarbosa.com' || location.hostname === 'www.andreobarbosa.com'
    </script>

    <!-- Google tag (gtag.js) — GA4 G-L354PT6WYD -->
    <script>
      (function () {
        if (!window.__medir) return
        var s = document.createElement('script')
        s.async = true
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-L354PT6WYD'
        document.head.appendChild(s)
        window.dataLayer = window.dataLayer || []
        window.gtag = function () { window.dataLayer.push(arguments) }
        window.gtag('js', new Date())
        window.gtag('config', 'G-L354PT6WYD', { send_page_view: false })
      })()
    </script>

    <!-- Microsoft Clarity — projeto ypht14ka1v (mapa de calor e gravação de
         sessão). Integrado ao GA4 pelo painel do Clarity, não por código. -->
    <script>
      (function (c, l, a, r, i, t, y) {
        if (!c.__medir) return
        c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) }
        t = l.createElement(r); t.async = 1; t.src = 'https://www.clarity.ms/tag/' + i
        y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y)
      })(window, document, 'clarity', 'script', 'ypht14ka1v')
    </script>

    <!-- Satoshi (Fontshare) -->
    <link rel="preconnect" href="https://api.fontshare.com" />

    <!-- Inter + JetBrains Mono + Outfit + Hanken Grotesk + ABeeZee + Newsreader + Source Serif 4 (Google Fonts) -->
    <!-- Newsreader: só Regular + Italic 400 — case Gabriel, título do Hero
         (nó 669:3805 do Figma). Source Serif 4: só Bold 700 — case
         Gabriel, amostra serifada da seção 07 Identidade Visual (nó
         653:1013 — rotulado no Figma como substituto temporário de
         "Sentient"; Google Fonts escolhido por confiabilidade de CDN,
         ver decisão do Andreo). Nenhum outro peso de nenhuma das duas é
         usado no site. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ABeeZee&family=Hanken+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,wght@0,400;1,400&family=Outfit:wght@200;300;400;500;600&family=Source+Serif+4:wght@700&display=swap"
