<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/logo/favicon/favicon.ico" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/x-icon" href="/logo/favicon/favicon-dark.ico" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo/favicon/favicon-32x32.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo/favicon/dark-favicon-32x32.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo/favicon/favicon-16x16.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo/favicon/dark-favicon-16x16.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/logo/favicon/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Andreo Barbosa — Product/UX Designer com raiz técnica e 5+ anos vivendo a dor real do usuário em saúde digital." />
    <meta name="author" content="Andreo Barbosa" />
    <link rel="canonical" href="https://andreobarbosa.com/" />

    <!-- Open Graph (revisão 26/08 — item P0.2): imagem dedicada 1200×630
         (public/og-image.png), URL absoluta — caminho relativo não
         renderiza card nenhum no LinkedIn/WhatsApp. Só a Home tem OG
         próprio por enquanto; sem SSR/pré-render (item P0.1, ainda em
         aberto) os cases sempre servem este mesmo index.html pros
         crawlers de link preview, então um og:title/description por
         case não teria efeito real até esse bloqueador ser resolvido. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://andreobarbosa.com/" />
    <meta property="og:site_name" content="Andreo Barbosa" />
    <meta property="og:title" content="Andreo Barbosa · Product/UX Designer" />
    <meta property="og:description" content="Product Designer com base em UX Research. Transformo pesquisa em decisões de produto que reduzem esforço e simplificam experiências complexas." />
    <meta property="og:image" content="https://andreobarbosa.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Andreo Barbosa — Product/UX Designer" />
    <meta property="og:locale" content="pt_BR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Andreo Barbosa · Product/UX Designer" />
    <meta name="twitter:description" content="Product Designer com base em UX Research. Transformo pesquisa em decisões de produto que reduzem esforço e simplificam experiências complexas." />
    <meta name="twitter:image" content="https://andreobarbosa.com/og-image.png" />

    <title>Andreo Barbosa · Product/UX Designer</title>

    <!-- Satoshi (Fontshare) -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@500,600,700&display=swap"
      rel="stylesheet"
    />

    <!-- Inter + JetBrains Mono + Outfit + Hanken Grotesk + ABeeZee + Newsreader + Source Serif 4 (Google Fonts) -->
    <!-- Newsreader: só Regular + Italic 400 — case Gabriel, título do Hero
         (nó 669:3805 do Figma). Source Serif 4: só Bold 700 — case
         Gabriel, amostra serifada da seção 07 Identidade Visual (nó
         653:1013 — rotulado no Figma como substituto temporário de
         "Sentient"; Google Fonts escolhido por confiabilidade de CDN,
         ver decisão do Andreo). Nenhum outro peso de nenhuma das duas é
         usado no site. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ABeeZee&family=Hanken+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,wght@0,400;1,400&family=Outfit:wght@200;300;400;500;600&family=Source+Serif+4:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
